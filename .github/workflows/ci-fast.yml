name: CI Fast

# This is the always-on check every pull request must satisfy: typecheck, the full
# suite against a real database, and a dependency vulnerability scan. No `paths`
# filter anywhere in this trigger block — D-09 and RESEARCH.md Pitfall 2: a required
# check attached to a workflow a path filter can skip entirely never reports at all,
# and GitHub's branch protection then waits on it forever. This workflow always
# triggers on every pull request and on every push to `main`.
on:
  pull_request: {}
  push:
    branches:
      - main

# Narrower than the repository default (T-05-32): nothing in this workflow needs to
# write anything, and a self-hosted runner is where an over-broad token costs the
# most.
permissions:
  contents: read

# A single-runner host means a queued, superseded run blocks every other pull
# request for the length of the run. Cancel the stale one on a force-push.
concurrency:
  group: ci-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Job id doubles as the required-status-check name: branch protection requires
  # exactly `fast` (docs/runbooks/ci-runner.md).
  fast:
    name: fast
    runs-on: [self-hosted, qmk-build]
    # A hung run holds the only runner this repository has. Release it.
    timeout-minutes: 20
    steps:
      # T-05-28/T-05-29 (D-06): checked as the FIRST step, before actions/checkout, so
      # a fork pull request's own code is never checked out onto this runner. This is
      # deliberately a STEP-level check rather than a job-level `if:` on the whole
      # job: GitHub Actions reports a job skipped by a job-level `if:` as a
      # "success"/neutral status, which satisfies a required check — precisely the
      # "cannot satisfy the gate by being skipped" failure this plan's must_haves
      # forbid (see docs/runbooks/ci-runner.md's fork-PR controls section). Failing
      # explicitly here makes the job's — and so `fast`'s — conclusion "failure",
      # which branch protection does not accept. On a `push` event
      # `github.event.pull_request` is unset, so this only constrains `pull_request`
      # triggers; a push can only land on `main` from inside this repository already.
      - name: Refuse to execute fork pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::fork pull request — the self-hosted runner never executes fork pull requests (D-06), so this required check fails explicitly rather than reporting a vacuous pass via a skipped job." >&2
          exit 1

      - uses: actions/checkout@v4

      # T-05-30: the only marketplace action either workflow in this repository uses
      # is actions/checkout above. No pnpm/action-setup — Node ships corepack, and
      # reading the pnpm version from package.json's `packageManager` field keeps the
      # pin in one place instead of repeating it here.
      - name: Enable pnpm (via corepack, pinned by package.json's packageManager)
        run: |
          corepack enable
          PNPM_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      # Frozen lockfile: a drifted lockfile fails this check rather than being
      # silently re-resolved into something nobody reviewed.
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # apps/api/src/builds/store-contract.test.ts's Postgres half self-skips when no
      # database is reachable (postgresAvailable(), lines 24-46). Without a real
      # database here, `pnpm test` would go green while never exercising 05-01's
      # admission-control concurrency assertions against Postgres — the single most
      # important thing in this phase to keep tested. This is not incidental weight
      # on a "fast" check; running the contract suite for real is the point of
      # bringing this database up at all.
      - name: Start development Postgres
        run: docker compose -f infra/deploy/docker-compose.yml up -d --wait

      - name: Typecheck
        run: pnpm typecheck

      # Runs vitest directly (not the `pnpm test` script) with `--reporter=verbose`:
      # the default reporter only prints a "N skipped" count for a file, not which
      # describe block was skipped, so the next step's grep would never match against
      # it. `pnpm test -- --reporter=verbose` does not work here either — pnpm's `--`
      # is appended after the script's own `vitest run`, producing a stray second
      # `--` that vitest parses as a positional test-name filter instead of a flag.
      - name: Test
        run: pnpm exec vitest run --reporter=verbose 2>&1 | tee /tmp/vitest-output.log

      # A self-skipping test that is allowed to self-skip in CI is not a test. If the
      # database above wasn't actually reachable, the `Test` step still exits 0 —
      # vitest reports a skipped suite as a pass — so this step is what turns a
      # silently-vacuous run into a real failure.
      - name: Assert the Postgres contract suite actually ran
        run: |
          if grep -q "PostgresBuildStore (no database reachable)" /tmp/vitest-output.log; then
            echo "::error::apps/api/src/builds/store-contract.test.ts's Postgres half self-skipped — no database was reachable. This check brings up infra/deploy/docker-compose.yml specifically to run that suite for real; a green run that skipped it proves nothing about admission-control concurrency." >&2
            exit 1
          fi

      - name: Dependency vulnerability scan
        run: pnpm audit --audit-level high

      # Runs even when an earlier step failed, so a failing PR doesn't leave the
      # compose stack running on the shared runner.
      - name: Stop development Postgres
        if: always()
        run: docker compose -f infra/deploy/docker-compose.yml down
